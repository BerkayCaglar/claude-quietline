name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      # The real install path, into a throwaway config folder whose name has a space in it.
      - name: install, doctor, uninstall
        shell: bash
        env:
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/claude config
        run: |
          node bin/cli.mjs install
          node bin/cli.mjs doctor
          node bin/cli.mjs uninstall
