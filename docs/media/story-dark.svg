<svg xmlns="http://www.w3.org/2000/svg" width="1048" height="102" viewBox="0 0 1048 102" role="img" aria-label="How the claude-quietline status line changes during a session">
<title>How the claude-quietline status line changes during a session</title>
<style>text{font-family:ui-monospace, SFMono-Regular, 'Cascadia Mono', Menlo, Consolas, 'Liberation Mono', monospace;font-size:14px;white-space:pre}.f{opacity:0;animation:show 20.8s steps(1,end) infinite}@keyframes show{0%{opacity:1}12.5%{opacity:0}100%{opacity:0}}.f0{animation-delay:-20.8s}.f1{animation-delay:-18.2s}.f2{animation-delay:-15.6s}.f3{animation-delay:-13s}.f4{animation-delay:-10.4s}.f5{animation-delay:-7.8s}.f6{animation-delay:-5.2s}.f7{animation-delay:-2.6s}@media (prefers-reduced-motion:reduce){.f{animation:none}.f7{opacity:1}}</style>
<rect x="0.5" y="0.5" width="1047" height="101" rx="10" fill="#181818" stroke="#2b2b2b"/>
<circle cx="20" cy="18" r="6" fill="#ff5f57"/>
<circle cx="40" cy="18" r="6" fill="#febc2e"/>
<circle cx="60" cy="18" r="6" fill="#28c840"/>
<g class="f f0"><text x="20" y="50" fill="#9d9d9d">A new session: model, folder and effort. Nothing else to say yet.</text><text x="28.4" y="82" fill="#22788d" textLength="92.4" lengthAdjust="spacingAndGlyphs">Opus 5 (1M)</text><text x="120.8" y="82" fill="#848484" textLength="100.8" lengthAdjust="spacingAndGlyphs"> | my-app | </text><text x="221.6" y="82" fill="#8a4d8a" textLength="42" lengthAdjust="spacingAndGlyphs">xhigh</text></g>
<g class="f f1"><text x="20" y="50" fill="#9d9d9d">Work starts: the context bar, yellow from 70%, red from 90%.</text><text x="28.4" y="82" fill="#22788d" textLength="92.4" lengthAdjust="spacingAndGlyphs">Opus 5 (1M)</text><text x="120.8" y="82" fill="#848484" textLength="226.8" lengthAdjust="spacingAndGlyphs"> | my-app | release prep | </text><text x="347.6" y="82" fill="#8a4d8a" textLength="42" lengthAdjust="spacingAndGlyphs">xhigh</text><text x="389.6" y="82" fill="#848484" textLength="25.2" lengthAdjust="spacingAndGlyphs"> | </text><rect x="414.8" y="71" width="8.8" height="14" fill="#1f875d" fill-opacity="1"/><rect x="423.2" y="71" width="8.8" height="14" fill="#1f875d" fill-opacity="1"/><rect x="431.6" y="71" width="8.8" height="14" fill="#1f875d" fill-opacity="1"/><rect x="440" y="71" width="8.8" height="14" fill="#1f875d" fill-opacity="0.28"/><rect x="448.4" y="71" width="8.8" height="14" fill="#1f875d" fill-opacity="0.28"/><rect x="456.8" y="71" width="8.8" height="14" fill="#1f875d" fill-opacity="0.28"/><rect x="465.2" y="71" width="8.8" height="14" fill="#1f875d" fill-opacity="0.28"/><rect x="473.6" y="71" width="8.8" height="14" fill="#1f875d" fill-opacity="0.28"/><rect x="482" y="71" width="8.8" height="14" fill="#1f875d" fill-opacity="0.28"/><rect x="490.4" y="71" width="8.8" height="14" fill="#1f875d" fill-opacity="0.28"/><rect x="498.8" y="71" width="8.8" height="14" fill="#1f875d" fill-opacity="0.28"/><rect x="507.2" y="71" width="8.8" height="14" fill="#1f875d" fill-opacity="0.28"/><rect x="515.6" y="71" width="8.8" height="14" fill="#1f875d" fill-opacity="0.28"/><rect x="524" y="71" width="8.8" height="14" fill="#1f875d" fill-opacity="0.28"/><rect x="532.4" y="71" width="8.8" height="14" fill="#1f875d" fill-opacity="0.28"/><rect x="540.8" y="71" width="8.8" height="14" fill="#1f875d" fill-opacity="0.28"/><text x="549.2" y="82" fill="#1f875d" textLength="33.6" lengthAdjust="spacingAndGlyphs"> 18%</text><text x="591.2" y="82" fill="#848484" textLength="58.8" lengthAdjust="spacingAndGlyphs">180k/1M</text></g>
<g class="f f2"><text x="20" y="50" fill="#9d9d9d">With an auto-compact window set, ┃ marks where compaction starts.</text><text x="28.4" y="82" fill="#22788d" textLength="92.4" lengthAdjust="spacingAndGlyphs">Opus 5 (1M)</text><text x="120.8" y="82" fill="#848484" textLength="226.8" lengthAdjust="spacingAndGlyphs"> | my-app | release prep | </text><text x="347.6" y="82" fill="#8a4d8a" textLength="42" lengthAdjust="spacingAndGlyphs">xhigh</text><text x="389.6" y="82" fill="#848484" textLength="25.2" lengthAdjust="spacingAndGlyphs"> | </text><rect x="414.8" y="71" width="8.8" height="14" fill="#1f875d" fill-opacity="1"/><rect x="423.2" y="71" width="8.8" height="14" fill="#1f875d" fill-opacity="1"/><rect x="431.6" y="71" width="8.8" height="14" fill="#1f875d" fill-opacity="1"/><rect x="440" y="71" width="8.8" height="14" fill="#1f875d" fill-opacity="1"/><rect x="448.4" y="71" width="8.8" height="14" fill="#1f875d" fill-opacity="1"/><rect x="456.8" y="71" width="8.8" height="14" fill="#1f875d" fill-opacity="0.28"/><rect x="465.2" y="71" width="8.8" height="14" fill="#1f875d" fill-opacity="0.28"/><rect x="473.6" y="71" width="8.8" height="14" fill="#1f875d" fill-opacity="0.28"/><rect x="482" y="71" width="8.8" height="14" fill="#1f875d" fill-opacity="0.28"/><rect x="490.4" y="71" width="8.8" height="14" fill="#1f875d" fill-opacity="0.28"/><rect x="498.8" y="71" width="8.8" height="14" fill="#1f875d" fill-opacity="0.28"/><rect x="510.15" y="68" width="2.5" height="20" rx="1" fill="#1f875d"/><rect x="515.6" y="71" width="8.8" height="14" fill="#1f875d" fill-opacity="0.28"/><rect x="524" y="71" width="8.8" height="14" fill="#1f875d" fill-opacity="0.28"/><rect x="532.4" y="71" width="8.8" height="14" fill="#1f875d" fill-opacity="0.28"/><rect x="540.8" y="71" width="8.8" height="14" fill="#1f875d" fill-opacity="0.28"/><text x="549.2" y="82" fill="#1f875d" textLength="33.6" lengthAdjust="spacingAndGlyphs"> 30%</text><text x="591.2" y="82" fill="#848484" textLength="58.8" lengthAdjust="spacingAndGlyphs">300k/1M</text></g>
<g class="f f3"><text x="20" y="50" fill="#9d9d9d">Past half that window, the headroom before compaction appears.</text><text x="28.4" y="82" fill="#22788d" textLength="92.4" lengthAdjust="spacingAndGlyphs">Opus 5 (1M)</text><text x="120.8" y="82" fill="#848484" textLength="226.8" lengthAdjust="spacingAndGlyphs"> | my-app | release prep | </text><text x="347.6" y="82" fill="#8a4d8a" textLength="42" lengthAdjust="spacingAndGlyphs">xhigh</text><text x="389.6" y="82" fill="#848484" textLength="25.2" lengthAdjust="spacingAndGlyphs"> | </text><rect x="414.8" y="71" width="8.8" height="14" fill="#1f875d" fill-opacity="1"/><rect x="423.2" y="71" width="8.8" height="14" fill="#1f875d" fill-opacity="1"/><rect x="431.6" y="71" width="8.8" height="14" fill="#1f875d" fill-opacity="1"/><rect x="440" y="71" width="8.8" height="14" fill="#1f875d" fill-opacity="1"/><rect x="448.4" y="71" width="8.8" height="14" fill="#1f875d" fill-opacity="1"/><rect x="456.8" y="71" width="8.8" height="14" fill="#1f875d" fill-opacity="1"/><rect x="465.2" y="71" width="8.8" height="14" fill="#1f875d" fill-opacity="1"/><rect x="473.6" y="71" width="8.8" height="14" fill="#1f875d" fill-opacity="1"/><rect x="482" y="71" width="8.8" height="14" fill="#1f875d" fill-opacity="0.28"/><rect x="490.4" y="71" width="8.8" height="14" fill="#1f875d" fill-opacity="0.28"/><rect x="498.8" y="71" width="8.8" height="14" fill="#1f875d" fill-opacity="0.28"/><rect x="510.15" y="68" width="2.5" height="20" rx="1" fill="#1f875d"/><rect x="515.6" y="71" width="8.8" height="14" fill="#1f875d" fill-opacity="0.28"/><rect x="524" y="71" width="8.8" height="14" fill="#1f875d" fill-opacity="0.28"/><rect x="532.4" y="71" width="8.8" height="14" fill="#1f875d" fill-opacity="0.28"/><rect x="540.8" y="71" width="8.8" height="14" fill="#1f875d" fill-opacity="0.28"/><text x="549.2" y="82" fill="#1f875d" textLength="33.6" lengthAdjust="spacingAndGlyphs"> 52%</text><text x="591.2" y="82" fill="#848484" textLength="184.8" lengthAdjust="spacingAndGlyphs">520k/1M | compact 180k</text></g>
<g class="f f4"><text x="20" y="50" fill="#9d9d9d">A long pause: the cache age, yellow at 75% of its lifetime.</text><text x="28.4" y="82" fill="#22788d" textLength="92.4" lengthAdjust="spacingAndGlyphs">Opus 5 (1M)</text><text x="120.8" y="82" fill="#848484" textLength="226.8" lengthAdjust="spacingAndGlyphs"> | my-app | release prep | </text><text x="347.6" y="82" fill="#8a4d8a" textLength="42" lengthAdjust="spacingAndGlyphs">xhigh</text><text x="389.6" y="82" fill="#848484" textLength="25.2" lengthAdjust="spacingAndGlyphs"> | </text><rect x="414.8" y="71" width="8.8" height="14" fill="#1f875d" fill-opacity="1"/><rect x="423.2" y="71" width="8.8" height="14" fill="#1f875d" fill-opacity="1"/><rect x="431.6" y="71" width="8.8" height="14" fill="#1f875d" fill-opacity="1"/><rect x="440" y="71" width="8.8" height="14" fill="#1f875d" fill-opacity="1"/><rect x="448.4" y="71" width="8.8" height="14" fill="#1f875d" fill-opacity="1"/><rect x="456.8" y="71" width="8.8" height="14" fill="#1f875d" fill-opacity="1"/><rect x="465.2" y="71" width="8.8" height="14" fill="#1f875d" fill-opacity="1"/><rect x="473.6" y="71" width="8.8" height="14" fill="#1f875d" fill-opacity="1"/><rect x="482" y="71" width="8.8" height="14" fill="#1f875d" fill-opacity="0.28"/><rect x="490.4" y="71" width="8.8" height="14" fill="#1f875d" fill-opacity="0.28"/><rect x="498.8" y="71" width="8.8" height="14" fill="#1f875d" fill-opacity="0.28"/><rect x="510.15" y="68" width="2.5" height="20" rx="1" fill="#1f875d"/><rect x="515.6" y="71" width="8.8" height="14" fill="#1f875d" fill-opacity="0.28"/><rect x="524" y="71" width="8.8" height="14" fill="#1f875d" fill-opacity="0.28"/><rect x="532.4" y="71" width="8.8" height="14" fill="#1f875d" fill-opacity="0.28"/><rect x="540.8" y="71" width="8.8" height="14" fill="#1f875d" fill-opacity="0.28"/><text x="549.2" y="82" fill="#1f875d" textLength="33.6" lengthAdjust="spacingAndGlyphs"> 52%</text><text x="591.2" y="82" fill="#848484" textLength="210" lengthAdjust="spacingAndGlyphs">520k/1M | compact 180k | </text><text x="801.2" y="82" fill="#9d9d32" textLength="75.6" lengthAdjust="spacingAndGlyphs">cache 47m</text></g>
<g class="f f5"><text x="20" y="50" fill="#9d9d9d">Expired: the next message re-reads the whole conversation.</text><text x="28.4" y="82" fill="#22788d" textLength="92.4" lengthAdjust="spacingAndGlyphs">Opus 5 (1M)</text><text x="120.8" y="82" fill="#848484" textLength="226.8" lengthAdjust="spacingAndGlyphs"> | my-app | release prep | </text><text x="347.6" y="82" fill="#8a4d8a" textLength="42" lengthAdjust="spacingAndGlyphs">xhigh</text><text x="389.6" y="82" fill="#848484" textLength="25.2" lengthAdjust="spacingAndGlyphs"> | </text><rect x="414.8" y="71" width="8.8" height="14" fill="#1f875d" fill-opacity="1"/><rect x="423.2" y="71" width="8.8" height="14" fill="#1f875d" fill-opacity="1"/><rect x="431.6" y="71" width="8.8" height="14" fill="#1f875d" fill-opacity="1"/><rect x="440" y="71" width="8.8" height="14" fill="#1f875d" fill-opacity="1"/><rect x="448.4" y="71" width="8.8" height="14" fill="#1f875d" fill-opacity="1"/><rect x="456.8" y="71" width="8.8" height="14" fill="#1f875d" fill-opacity="1"/><rect x="465.2" y="71" width="8.8" height="14" fill="#1f875d" fill-opacity="1"/><rect x="473.6" y="71" width="8.8" height="14" fill="#1f875d" fill-opacity="1"/><rect x="482" y="71" width="8.8" height="14" fill="#1f875d" fill-opacity="0.28"/><rect x="490.4" y="71" width="8.8" height="14" fill="#1f875d" fill-opacity="0.28"/><rect x="498.8" y="71" width="8.8" height="14" fill="#1f875d" fill-opacity="0.28"/><rect x="510.15" y="68" width="2.5" height="20" rx="1" fill="#1f875d"/><rect x="515.6" y="71" width="8.8" height="14" fill="#1f875d" fill-opacity="0.28"/><rect x="524" y="71" width="8.8" height="14" fill="#1f875d" fill-opacity="0.28"/><rect x="532.4" y="71" width="8.8" height="14" fill="#1f875d" fill-opacity="0.28"/><rect x="540.8" y="71" width="8.8" height="14" fill="#1f875d" fill-opacity="0.28"/><text x="549.2" y="82" fill="#1f875d" textLength="33.6" lengthAdjust="spacingAndGlyphs"> 52%</text><text x="591.2" y="82" fill="#848484" textLength="210" lengthAdjust="spacingAndGlyphs">520k/1M | compact 180k | </text><text x="801.2" y="82" fill="#9a3737" textLength="84" lengthAdjust="spacingAndGlyphs">cache cold</text></g>
<g class="f f6"><text x="20" y="50" fill="#9d9d9d">Plan limits speak up past 70%; the reset time joins past 85%.</text><text x="28.4" y="82" fill="#22788d" textLength="92.4" lengthAdjust="spacingAndGlyphs">Opus 5 (1M)</text><text x="120.8" y="82" fill="#848484" textLength="226.8" lengthAdjust="spacingAndGlyphs"> | my-app | release prep | </text><text x="347.6" y="82" fill="#8a4d8a" textLength="42" lengthAdjust="spacingAndGlyphs">xhigh</text><text x="389.6" y="82" fill="#848484" textLength="25.2" lengthAdjust="spacingAndGlyphs"> | </text><rect x="414.8" y="71" width="8.8" height="14" fill="#1f875d" fill-opacity="1"/><rect x="423.2" y="71" width="8.8" height="14" fill="#1f875d" fill-opacity="1"/><rect x="431.6" y="71" width="8.8" height="14" fill="#1f875d" fill-opacity="1"/><rect x="440" y="71" width="8.8" height="14" fill="#1f875d" fill-opacity="1"/><rect x="448.4" y="71" width="8.8" height="14" fill="#1f875d" fill-opacity="1"/><rect x="456.8" y="71" width="8.8" height="14" fill="#1f875d" fill-opacity="1"/><rect x="465.2" y="71" width="8.8" height="14" fill="#1f875d" fill-opacity="1"/><rect x="473.6" y="71" width="8.8" height="14" fill="#1f875d" fill-opacity="1"/><rect x="482" y="71" width="8.8" height="14" fill="#1f875d" fill-opacity="1"/><rect x="490.4" y="71" width="8.8" height="14" fill="#1f875d" fill-opacity="0.28"/><rect x="498.8" y="71" width="8.8" height="14" fill="#1f875d" fill-opacity="0.28"/><rect x="510.15" y="68" width="2.5" height="20" rx="1" fill="#1f875d"/><rect x="515.6" y="71" width="8.8" height="14" fill="#1f875d" fill-opacity="0.28"/><rect x="524" y="71" width="8.8" height="14" fill="#1f875d" fill-opacity="0.28"/><rect x="532.4" y="71" width="8.8" height="14" fill="#1f875d" fill-opacity="0.28"/><rect x="540.8" y="71" width="8.8" height="14" fill="#1f875d" fill-opacity="0.28"/><text x="549.2" y="82" fill="#1f875d" textLength="33.6" lengthAdjust="spacingAndGlyphs"> 58%</text><text x="591.2" y="82" fill="#848484" textLength="84" lengthAdjust="spacingAndGlyphs">580k/1M | </text><text x="675.2" y="82" fill="#9d9d32" textLength="100.8" lengthAdjust="spacingAndGlyphs">compact 120k</text><text x="776" y="82" fill="#848484" textLength="25.2" lengthAdjust="spacingAndGlyphs"> | </text><text x="801.2" y="82" fill="#9a3737" textLength="50.4" lengthAdjust="spacingAndGlyphs">5h 91%</text><text x="851.6" y="82" fill="#848484" textLength="50.4" lengthAdjust="spacingAndGlyphs"> (14m)</text></g>
<g class="f f7"><text x="20" y="50" fill="#9d9d9d">Close to compaction: /clear is free, compacting later is not.</text><text x="28.4" y="82" fill="#22788d" textLength="92.4" lengthAdjust="spacingAndGlyphs">Opus 5 (1M)</text><text x="120.8" y="82" fill="#848484" textLength="226.8" lengthAdjust="spacingAndGlyphs"> | my-app | release prep | </text><text x="347.6" y="82" fill="#8a4d8a" textLength="42" lengthAdjust="spacingAndGlyphs">xhigh</text><text x="389.6" y="82" fill="#848484" textLength="25.2" lengthAdjust="spacingAndGlyphs"> | </text><rect x="414.8" y="71" width="8.8" height="14" fill="#1f875d" fill-opacity="1"/><rect x="423.2" y="71" width="8.8" height="14" fill="#1f875d" fill-opacity="1"/><rect x="431.6" y="71" width="8.8" height="14" fill="#1f875d" fill-opacity="1"/><rect x="440" y="71" width="8.8" height="14" fill="#1f875d" fill-opacity="1"/><rect x="448.4" y="71" width="8.8" height="14" fill="#1f875d" fill-opacity="1"/><rect x="456.8" y="71" width="8.8" height="14" fill="#1f875d" fill-opacity="1"/><rect x="465.2" y="71" width="8.8" height="14" fill="#1f875d" fill-opacity="1"/><rect x="473.6" y="71" width="8.8" height="14" fill="#1f875d" fill-opacity="1"/><rect x="482" y="71" width="8.8" height="14" fill="#1f875d" fill-opacity="1"/><rect x="490.4" y="71" width="8.8" height="14" fill="#1f875d" fill-opacity="1"/><rect x="498.8" y="71" width="8.8" height="14" fill="#1f875d" fill-opacity="1"/><rect x="510.15" y="68" width="2.5" height="20" rx="1" fill="#1f875d"/><rect x="515.6" y="71" width="8.8" height="14" fill="#1f875d" fill-opacity="0.28"/><rect x="524" y="71" width="8.8" height="14" fill="#1f875d" fill-opacity="0.28"/><rect x="532.4" y="71" width="8.8" height="14" fill="#1f875d" fill-opacity="0.28"/><rect x="540.8" y="71" width="8.8" height="14" fill="#1f875d" fill-opacity="0.28"/><text x="549.2" y="82" fill="#1f875d" textLength="33.6" lengthAdjust="spacingAndGlyphs"> 66%</text><text x="591.2" y="82" fill="#848484" textLength="84" lengthAdjust="spacingAndGlyphs">660k/1M | </text><text x="675.2" y="82" fill="#9a3737" textLength="92.4" lengthAdjust="spacingAndGlyphs">compact 40k</text><text x="767.6" y="82" fill="#848484" textLength="25.2" lengthAdjust="spacingAndGlyphs"> | </text><text x="792.8" y="82" fill="#9a3737" textLength="50.4" lengthAdjust="spacingAndGlyphs">5h 91%</text><text x="843.2" y="82" fill="#848484" textLength="50.4" lengthAdjust="spacingAndGlyphs"> (14m)</text></g>
